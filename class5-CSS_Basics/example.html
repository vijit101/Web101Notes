<!DOCTYPE html>
<html>
<head>
    <title>CSS Selectors Practice</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- h1 -->
    <h1>Normal Heading</h1>

    <!-- .science -->
    <p class="science">Science is fascinating.</p>

    <!-- .literature -->
    <p class="literature">Literature tells stories.</p>

    <!-- #the-one -->
    <p id="the-one">I am the one.</p>

    <!-- div li -->
    <div>
        <ul>
            <li>Physics</li>
            <li>Chemistry</li>
        </ul>
    </div>

    <!-- div > h1 > span -->
    <div>
        <h1>
            <span>Direct child span inside h1</span>
        </h1>
    </div>

    <!-- .m1.m2 -->
    <p class="m1 m2">I have BOTH m1 and m2 classes.</p>

    <!-- a:hover -->
    <a href="https://example.com">Hover over me</a>
<div class="background">
    <h2>Background Image Example</h2>
    <p>This div has a background image.</p>
</div>
</body>
</html>
